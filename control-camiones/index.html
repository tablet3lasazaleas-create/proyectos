<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Control de camiones</title>
<style>
:root{--ink:#202938;--muted:#778091;--line:#e7eaf0;--bg:#f4f6f9;--white:#fff;--blue:#245fbb;--blue2:#eaf1fc;--green:#16835d;--greenbg:#e8f5ee;--red:#c34e55;--redbg:#fbecee;--amber:#b2741c;--shadow:0 8px 30px #18263a0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:13px;position:sticky;top:0;z-index:4}.mark{height:33px;width:33px;background:#245fbb;color:white;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:16px}.brand{font-size:16px;font-weight:750;letter-spacing:-.3px}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:0}.topspacer{flex:1}.topnote{font-size:12px;color:var(--muted)}.profile{height:31px;width:31px;border-radius:50%;display:grid;place-items:center;background:#e8effa;color:#315fa5;font-weight:700}.layout{display:grid;grid-template-columns:226px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid var(--line);padding:24px 14px}.side-title{padding:8px 11px 12px;font-size:10px;font-weight:750;letter-spacing:1px;text-transform:uppercase;color:#9aa2ae}.nav{width:100%;border:0;background:transparent;color:#626d7d;text-align:left;padding:10px 12px;border-radius:7px;display:flex;align-items:center;gap:11px;margin:3px 0}.nav:hover,.nav.active{background:var(--blue2);color:var(--blue);font-weight:650}.nav .nav-icon{width:17px;text-align:center;font-size:15px}.aside-note{border-top:1px solid var(--line);margin:26px 9px 0;padding:15px 3px 0;color:#8b93a0;font-size:11px;line-height:1.55}.main{padding:32px clamp(18px,4vw,54px);max-width:1250px;width:100%;margin:auto}.crumb{font-size:11px;color:#969eaa;margin-bottom:9px}.heading{display:flex;align-items:flex-start;gap:14px;margin-bottom:23px}.heading h1{font-size:26px;letter-spacing:-.8px;margin:0 0 4px}.heading p{margin:0;color:var(--muted);font-size:13px}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid #dce1e9;background:#fff;color:#435065;border-radius:7px;padding:9px 12px;font-weight:620}.btn:hover{border-color:#aac1e5}.btn.primary{color:#fff;background:var(--blue);border-color:var(--blue)}.btn.primary:hover{background:#194f9e}.btn.danger{color:var(--red);border-color:#f0d6d8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:19px 0 26px}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px 17px;box-shadow:var(--shadow)}.stat-label{font-size:11px;color:var(--muted)}.stat-value{font-size:24px;font-weight:750;letter-spacing:-.7px;margin-top:5px}.stat-foot{font-size:10px;color:#9aa1ac;margin-top:1px}.money{font-variant-numeric:tabular-nums}.columns{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,.9fr);gap:15px}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}.panel-title{padding:16px 18px;border-bottom:1px solid #eff1f4;display:flex;align-items:center}.panel-title h2{font-size:14px;margin:0;font-weight:700}.panel-title small{color:#99a0ab;margin-left:8px}.panel-title .btn{margin-left:auto;padding:6px 9px;font-size:11px}.rows{width:100%;border-collapse:collapse}.rows th,.rows td{text-align:left;padding:11px 14px;border-bottom:1px solid #f0f2f5;font-size:12px}.rows th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#929aa6;background:#fcfcfd;font-weight:700}.rows tr:last-child td{border-bottom:0}.rows td.muted{color:#858e9d}.rows td.num{text-align:right;font-variant-numeric:tabular-nums}.material{display:inline-flex;background:#f0f3f7;color:#576174;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:650}.material[data-m="Balastro"]{background:#f4f0e8;color:#8a6a30}.material[data-m="Piedrín"]{background:#edf0f3;color:#586572}.material[data-m="Asfalto"]{background:#ececf0;color:#444654}.badge{display:inline-flex;border-radius:20px;padding:4px 8px;background:var(--greenbg);color:var(--green);font-weight:700;font-size:10px}.badge.neg{background:var(--redbg);color:var(--red)}.bar-list{padding:15px 18px}.bar-item{margin-bottom:18px}.bar-head{display:flex;justify-content:space-between;font-size:11px;margin-bottom:7px}.bar-head span:last-child{color:#7d8795;font-variant-numeric:tabular-nums}.bar{height:7px;background:#eff1f4;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:10px}.section-head{display:flex;align-items:center;margin:23px 0 11px}.section-head h2{font-size:15px;margin:0}.section-head span{color:#959daa;font-size:11px;margin-left:8px}.section-head .btn{margin-left:auto}.filterbar{background:white;border:1px solid var(--line);padding:12px;display:flex;gap:9px;align-items:center;border-radius:9px 9px 0 0}.filterbar select,.filterbar input{border:1px solid #e0e4ea;padding:8px 10px;border-radius:6px;color:#4a5668;background:white}.filterbar input{flex:1;min-width:135px}.tablewrap{overflow:auto}.list-panel{border-top:0;border-radius:0 0 9px 9px}.empty{background:#fff;border:1px dashed #d6dce5;border-radius:9px;padding:45px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}.actions-cell{white-space:nowrap}.text-btn{border:0;background:none;color:#7b8492;font-size:11px;padding:3px 5px}.text-btn:hover{color:var(--red)}.modal-back{position:fixed;inset:0;background:#19263b70;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(485px,100%);background:#fff;border-radius:12px;padding:22px;box-shadow:0 20px 70px #11182738}.modal h2{margin:0 0 3px;font-size:19px}.modal>p{margin:0 0 15px;font-size:12px;color:var(--muted)}.field{display:block;margin:12px 0}.field span{display:block;font-size:11px;font-weight:700;margin-bottom:5px;color:#475367}.field input,.field select,.field textarea{width:100%;border:1px solid #dce1e9;border-radius:7px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7da2db;box-shadow:0 0 0 3px #245fbb15}.field textarea{min-height:65px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:15;background:#202938;color:#fff;padding:10px 15px;border-radius:8px;font-size:12px;box-shadow:0 6px 22px #1114}.quick-info{font-size:11px;color:#8a93a1;padding:0 18px 15px}.mobile-nav{display:none}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.layout{grid-template-columns:190px 1fr}}
@media(max-width:650px){.top{padding:0 15px}.topnote{display:none}.layout{display:block;padding-bottom:62px}aside{display:none}.main{padding:24px 14px}.heading{flex-wrap:wrap}.actions{margin:8px 0 0;width:100%}.stats{gap:8px}.stat{padding:12px}.stat-value{font-size:21px}.mobile-nav{display:flex;position:fixed;z-index:5;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:5px}.mobile-nav .nav{width:auto;justify-content:center;flex:1;flex-direction:column;gap:2px;font-size:9px;padding:5px 2px}.filterbar{flex-wrap:wrap}.filterbar select{flex:1;min-width:42%}.filterbar input{flex-basis:100%}.rows th,.rows td{padding:10px 9px}.rows th{font-size:9px}.hide-mobile{display:none}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="mark">C</div><div class="brand">Control de camiones<small>Operación y movimientos</small></div><div class="topspacer"></div><div class="topnote">Administración de transporte</div><div class="profile">A</div></header>
<div class="layout"><aside><div class="side-title">Panel de control</div><button class="nav active" data-view="summary"><span class="nav-icon">▦</span>Resumen</button><button class="nav" data-view="trips"><span class="nav-icon">↗</span>Camionadas</button><button class="nav" data-view="trucks"><span class="nav-icon">▰</span>Camiones</button><div class="aside-note">Controla distribuidores, placas, materiales e ingresos y egresos de cada camionada.</div></aside><main class="main" id="main"></main></div><nav class="mobile-nav"><button class="nav active" data-view="summary"><span>▦</span>Resumen</button><button class="nav" data-view="trips"><span>↗</span>Camionadas</button><button class="nav" data-view="trucks"><span>▰</span>Camiones</button></nav></div><div id="overlay"></div><div id="toast" class="toast hidden"></div>
<script>
const KEY='control-camiones-v1',MATERIALS=['Balastro','Piedrín','Asfalto'];let data=read(),view='summary',filters={material:'',truck:'',search:''};
function read(){try{return JSON.parse(localStorage.getItem(KEY))||{distributors:[],trucks:[],trips:[]}}catch{return{distributors:[],trucks:[],trips:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function id(){return crypto.randomUUID()}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cash(n){return 'Q '+Number(n||0).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2})}
function truck(id){return data.trucks.find(x=>x.id===id)}function distributor(id){return data.distributors.find(x=>x.id===id)}
function monthTrips(){let d=new Date(),m=d.getMonth(),y=d.getFullYear();return data.trips.filter(t=>{let x=new Date(t.date+'T12:00:00');return x.getMonth()===m&&x.getFullYear()===y})}
function totals(list=data.trips){return list.reduce((a,t)=>({income:a.income+Number(t.income||0),expense:a.expense+Number(t.expense||0)}),{income:0,expense:0})}
function date(s){if(!s)return'—';return new Date(s+'T12:00:00').toLocaleDateString('es-GT',{day:'2-digit',month:'short',year:'numeric'})}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function nav(){document.querySelectorAll('[data-view]').forEach(e=>e.classList.toggle('active',e.dataset.view===view))}
function render(){nav();let root=document.getElementById('main');if(view==='trucks')renderTrucks(root);else if(view==='trips')renderTrips(root);else renderSummary(root)}
function stats(items){let t=totals(items);return `<div class="stats"><div class="stat"><div class="stat-label">Camionadas registradas</div><div class="stat-value">${items.length}</div><div class="stat-foot">${items===monthTrips()?'Este mes':'En el período seleccionado'}</div></div><div class="stat"><div class="stat-label">Ingresos</div><div class="stat-value money">${cash(t.income)}</div><div class="stat-foot">Por camionadas registradas</div></div><div class="stat"><div class="stat-label">Egresos</div><div class="stat-value money">${cash(t.expense)}</div><div class="stat-foot">Costos registrados</div></div><div class="stat"><div class="stat-label">Balance</div><div class="stat-value money" style="color:${t.income-t.expense>=0?'var(--green)':'var(--red)'}">${cash(t.income-t.expense)}</div><div class="stat-foot">Ingresos menos egresos</div></div></div>`}
function table(items,showActions=true){if(!items.length)return `<div class="empty"><strong>No hay camionadas todavía</strong>Registra la primera camionada para comenzar el control.</div>`;return `<div class="panel tablewrap ${showActions?'':'list-panel'}"><table class="rows"><thead><tr><th>Fecha</th><th>Camión</th><th class="hide-mobile">Distribuidor</th><th>Material</th><th class="hide-mobile">Cantidad</th><th>Ingreso</th><th class="hide-mobile">Egreso</th>${showActions?'<th></th>':''}</tr></thead><tbody>${items.map(t=>{let tr=truck(t.truckId),d=tr&&distributor(tr.distributorId);return `<tr><td>${date(t.date)}</td><td><b>${esc(tr?.plate||'Camión eliminado')}</b></td><td class="muted hide-mobile">${esc(d?.name||'—')}</td><td><span class="material" data-m="${esc(t.material)}">${esc(t.material)}</span></td><td class="muted hide-mobile">${Number(t.quantity||0).toLocaleString('es-GT')} ${esc(t.unit||'viajes')}</td><td class="money">${cash(t.income)}</td><td class="money hide-mobile">${cash(t.expense)}</td>${showActions?`<td class="actions-cell"><button class="text-btn" data-delete-trip="${t.id}" title="Eliminar camionada">Eliminar</button></td>`:''}</tr>`}).join('')}</tbody></table></div>`}
function renderSummary(root){let mo=monthTrips(),t=totals(data.trips);root.innerHTML=`<div class="crumb">Operación / Resumen</div><div class="heading"><div><h1>Resumen</h1><p>Vista general de camionadas e ingresos y egresos.</p></div><div class="actions"><button class="btn" id="export">Exportar datos</button><button class="btn primary" id="quick-add">＋ Nueva camionada</button></div></div>${stats(mo)}<div class="columns"><section class="panel"><div class="panel-title"><h2>Camionadas recientes</h2><small>${data.trips.length} total</small><button class="btn" id="all-trips">Ver todas</button></div>${data.trips.length?table([...data.trips].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6),false):`<div class="empty" style="margin:14px"><strong>Aún no hay registros</strong>Agrega una camionada para ver aquí la actividad.</div>`}</section><section class="panel"><div class="panel-title"><h2>Materiales del mes</h2></div><div class="bar-list">${MATERIALS.map(m=>{let count=mo.filter(x=>x.material===m).length,pct=mo.length?Math.round(count/mo.length*100):0;return `<div class="bar-item"><div class="bar-head"><span>${m}</span><span>${count} camionadas · ${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')}</div><div class="quick-info">${data.trucks.length} camiones · ${data.distributors.length} distribuidores</div></section></div><div class="section-head"><h2>Ingresos y egresos acumulados</h2></div><div class="stats"><div class="stat"><div class="stat-label">Balastro · ingresos</div><div class="stat-value money">${cash(totals(data.trips.filter(x=>x.material==='Balastro')).income)}</div><div class="stat-foot">Todo el período</div></div><div class="stat"><div class="stat-label">Piedrín · ingresos</div><div class="stat-value money">${cash(totals(data.trips.filter(x=>x.material==='Piedrín')).income)}</div><div class="stat-foot">Todo el período</div></div><div class="stat"><div class="stat-label">Asfalto · ingresos</div><div class="stat-value money">${cash(totals(data.trips.filter(x=>x.material==='Asfalto')).income)}</div><div class="stat-foot">Todo el período</div></div><div class="stat"><div class="stat-label">Camiones activos</div><div class="stat-value">${data.trucks.length}</div><div class="stat-foot">Con placa registrada</div></div></div>`;
root.querySelector('#quick-add').onclick=()=>tripModal();root.querySelector('#all-trips').onclick=()=>{view='trips';render()};root.querySelector('#export').onclick=exportData;root.querySelectorAll('[data-delete-trip]').forEach(b=>b.onclick=()=>deleteTrip(b.dataset.deleteTrip))}
function renderTrucks(root){root.innerHTML=`<div class="crumb">Operación / Camiones</div><div class="heading"><div><h1>Camiones y distribuidores</h1><p>Registra a cada distribuidor y vincúlalo con sus camiones por placa.</p></div><div class="actions"><button class="btn" id="add-distributor">＋ Distribuidor</button><button class="btn primary" id="add-truck">＋ Camión</button></div></div><div class="stats"><div class="stat"><div class="stat-label">Camiones</div><div class="stat-value">${data.trucks.length}</div><div class="stat-foot">Identificados por placa</div></div><div class="stat"><div class="stat-label">Distribuidores</div><div class="stat-value">${data.distributors.length}</div><div class="stat-foot">Registrados en el sistema</div></div><div class="stat"><div class="stat-label">Camionadas</div><div class="stat-value">${data.trips.length}</div><div class="stat-foot">En todo el período</div></div><div class="stat"><div class="stat-label">Balance acumulado</div><div class="stat-value money">${cash(totals().income-totals().expense)}</div><div class="stat-foot">Ingresos menos egresos</div></div></div><div class="section-head"><h2>Camiones registrados</h2><span>${data.trucks.length}</span></div>${data.trucks.length?`<div class="panel tablewrap"><table class="rows"><thead><tr><th>Placa</th><th>Distribuidor</th><th>Camionadas</th><th>Ingresos</th><th>Egresos</th><th></th></tr></thead><tbody>${data.trucks.map(tr=>{let ts=data.trips.filter(t=>t.truckId===tr.id),s=totals(ts);return `<tr><td><b>${esc(tr.plate)}</b></td><td>${esc(distributor(tr.distributorId)?.name||'—')}</td><td>${ts.length}</td><td class="money">${cash(s.income)}</td><td class="money">${cash(s.expense)}</td><td><button class="text-btn" data-delete-truck="${tr.id}">Eliminar</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><strong>Registra tu primer camión</strong>Añade un distribuidor y la placa del camión para empezar.<div style="margin-top:14px;display:flex;gap:8px;justify-content:center"><button class="btn" id="empty-dist">＋ Distribuidor</button><button class="btn primary" id="empty-truck">＋ Camión</button></div></div>`}<div class="section-head"><h2>Distribuidores</h2><span>${data.distributors.length}</span></div>${data.distributors.length?`<div class="panel tablewrap"><table class="rows"><thead><tr><th>Nombre del distribuidor</th><th>Camiones asociados</th><th>Camionadas</th><th></th></tr></thead><tbody>${data.distributors.map(d=>{let ts=data.trucks.filter(tr=>tr.distributorId===d.id),n=ts.reduce((a,tr)=>a+data.trips.filter(t=>t.truckId===tr.id).length,0);return `<tr><td><b>${esc(d.name)}</b></td><td>${ts.map(x=>esc(x.plate)).join(', ')||'—'}</td><td>${n}</td><td><button class="text-btn" data-delete-dist="${d.id}">Eliminar</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><strong>No hay distribuidores registrados</strong>Agrega los nombres de los distribuidores que manejan los camiones.</div>`}`;
root.querySelector('#add-distributor').onclick=()=>distributorModal();root.querySelector('#empty-dist')?.addEventListener('click',()=>distributorModal());root.querySelector('#add-truck').onclick=()=>truckModal();root.querySelector('#empty-truck')?.addEventListener('click',()=>truckModal());root.querySelectorAll('[data-delete-truck]').forEach(b=>b.onclick=()=>deleteTruck(b.dataset.deleteTruck));root.querySelectorAll('[data-delete-dist]').forEach(b=>b.onclick=()=>deleteDistributor(b.dataset.deleteDist))}
function renderTrips(root){let items=[...data.trips].filter(t=>(!filters.material||t.material===filters.material)&&(!filters.truck||t.truckId===filters.truck)&&(`${truck(t.truckId)?.plate||''} ${distributor(truck(t.truckId)?.distributorId)?.name||''} ${t.material} ${t.note||''}`.toLowerCase().includes(filters.search.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));root.innerHTML=`<div class="crumb">Operación / Camionadas</div><div class="heading"><div><h1>Camionadas</h1><p>Registra el material transportado y sus ingresos y egresos.</p></div><div class="actions"><button class="btn" id="export">Exportar datos</button><button class="btn primary" id="add-trip">＋ Nueva camionada</button></div></div>${stats(items)}<div class="section-head"><h2>Registro de camionadas</h2><span>${items.length}</span></div><div class="filterbar"><input id="search-trip" placeholder="Buscar placa, distribuidor o nota..." value="${esc(filters.search)}"><select id="filter-truck"><option value="">Todos los camiones</option>${data.trucks.map(x=>`<option value="${x.id}" ${filters.truck===x.id?'selected':''}>${esc(x.plate)}</option>`).join('')}</select><select id="filter-material"><option value="">Todos los materiales</option>${MATERIALS.map(x=>`<option ${filters.material===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" id="clear">Limpiar</button></div>${items.length?table(items):`<div class="empty" style="border-radius:0 0 9px 9px"><strong>${data.trips.length?'No hay resultados':'No hay camionadas todavía'}</strong>${data.trips.length?'Ajusta los filtros para ver más registros.':'Añade una camionada para comenzar el control.'}<div style="margin-top:13px"><button class="btn primary" id="empty-trip">＋ Nueva camionada</button></div></div>`}`;
root.querySelector('#add-trip').onclick=()=>tripModal();root.querySelector('#empty-trip')?.addEventListener('click',()=>tripModal());root.querySelector('#export').onclick=exportData;root.querySelector('#filter-truck').onchange=e=>{filters.truck=e.target.value;render()};root.querySelector('#filter-material').onchange=e=>{filters.material=e.target.value;render()};root.querySelector('#search-trip').oninput=e=>{filters.search=e.target.value;let pos=e.target.selectionStart;render();let x=document.getElementById('search-trip');x.focus();x.setSelectionRange(pos,pos)};root.querySelector('#clear').onclick=()=>{filters={material:'',truck:'',search:''};render()};root.querySelectorAll('[data-delete-trip]').forEach(b=>b.onclick=()=>deleteTrip(b.dataset.deleteTrip))}
function modal(html){document.getElementById('overlay').innerHTML=`<div class="modal-back" id="modal-back"><section class="modal">${html}</section></div>`;document.getElementById('modal-back').onclick=e=>{if(e.target.id==='modal-back')closeModal()}}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function distributorModal(){modal(`<h2>Nuevo distribuidor</h2><p>Registra el nombre para vincularlo con sus camiones.</p><form id="dist-form"><label class="field"><span>Nombre del distribuidor *</span><input name="name" maxlength="80" required placeholder="Ej. Distribuidora Central"></label><div class="modal-actions"><button class="btn" type="button" id="cancel">Cancelar</button><button class="btn primary">Guardar distribuidor</button></div></form>`);document.getElementById('cancel').onclick=closeModal;document.getElementById('dist-form').onsubmit=e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(!name)return;if(data.distributors.some(x=>x.name.toLowerCase()===name.toLowerCase()))return toast('Ese distribuidor ya está registrado');data.distributors.push({id:id(),name});closeModal();save();toast('Distribuidor guardado')};setTimeout(()=>document.querySelector('[name=name]')?.focus(),0)}
function truckModal(){if(!data.distributors.length){distributorModal();toast('Primero registra un distribuidor');return}modal(`<h2>Registrar camión</h2><p>Identifica el camión por su placa y asígnalo a un distribuidor.</p><form id="truck-form"><label class="field"><span>Placa *</span><input name="plate" required maxlength="20" placeholder="Ej. P-123ABC"></label><label class="field"><span>Distribuidor *</span><select name="distributorId" required><option value="">Selecciona distribuidor</option>${data.distributors.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></label><div class="modal-actions"><button class="btn" type="button" id="cancel">Cancelar</button><button class="btn primary">Guardar camión</button></div></form>`);document.getElementById('cancel').onclick=closeModal;document.getElementById('truck-form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.plate=d.plate.trim().toUpperCase();if(data.trucks.some(x=>x.plate.toLowerCase()===d.plate.toLowerCase()))return toast('Esa placa ya está registrada');data.trucks.push({id:id(),...d});closeModal();save();toast('Camión guardado')};setTimeout(()=>document.querySelector('[name=plate]')?.focus(),0)}
function tripModal(){if(!data.trucks.length){view='trucks';render();toast('Primero registra un distribuidor y un camión');return}let today=new Date().toISOString().slice(0,10);modal(`<h2>Nueva camionada</h2><p>Registra el viaje, material y movimiento de dinero.</p><form id="trip-form"><div class="formgrid"><label class="field"><span>Fecha *</span><input name="date" type="date" required value="${today}"></label><label class="field"><span>Camión / placa *</span><select name="truckId" required>${data.trucks.map(x=>`<option value="${x.id}">${esc(x.plate)} · ${esc(distributor(x.distributorId)?.name||'')}</option>`).join('')}</select></label><label class="field"><span>Material *</span><select name="material" required>${MATERIALS.map(m=>`<option>${m}</option>`).join('')}</select></label><label class="field"><span>Camionadas *</span><input name="quantity" type="number" required min="1" step="1" value="1"></label><label class="field"><span>Unidad</span><select name="unit"><option>viajes</option><option>m³</option><option>toneladas</option></select></label><label class="field"><span>Ingreso (Q) *</span><input name="income" type="number" required min="0" step="0.01" value="0"></label><label class="field"><span>Egreso (Q) *</span><input name="expense" type="number" required min="0" step="0.01" value="0"></label><label class="field"><span>Nota (opcional)</span><input name="note" maxlength="100" placeholder="Destino u observación"></label></div><div class="modal-actions"><button class="btn" type="button" id="cancel">Cancelar</button><button class="btn primary">Guardar camionada</button></div></form>`);document.getElementById('cancel').onclick=closeModal;document.getElementById('trip-form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));data.trips.push({id:id(),...d,quantity:Number(d.quantity),income:Number(d.income),expense:Number(d.expense)});closeModal();save();toast('Camionada guardada')};setTimeout(()=>document.querySelector('[name=date]')?.focus(),0)}
function deleteTrip(tid){if(!confirm('¿Eliminar este registro de camionada?'))return;data.trips=data.trips.filter(t=>t.id!==tid);save();toast('Camionada eliminada')}
function deleteTruck(tid){if(data.trips.some(t=>t.truckId===tid))return toast('No puedes eliminar un camión con camionadas registradas');if(!confirm('¿Eliminar este camión?'))return;data.trucks=data.trucks.filter(t=>t.id!==tid);save();toast('Camión eliminado')}
function deleteDistributor(did){if(data.trucks.some(t=>t.distributorId===did))return toast('Asigna sus camiones a otro distribuidor antes de eliminarlo');if(!confirm('¿Eliminar este distribuidor?'))return;data.distributors=data.distributors.filter(d=>d.id!==did);save();toast('Distribuidor eliminado')}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='control-camiones.json';a.click();URL.revokeObjectURL(a.href);toast('Datos exportados')}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();
</script></body></html>
