<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyectos | Nexo</title>
  <style>
    :root{--ink:#282633;--muted:#777583;--line:#ecebf0;--bg:#f7f7f9;--purple:#714bdb;--lav:#f1edfc;--green:#16856b;--amber:#b97716;--red:#c35562}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 30px;gap:28px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:17px;letter-spacing:-.4px}.brand-mark{height:29px;width:29px;border-radius:9px;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:800}.topnav{display:flex;gap:22px;height:100%;align-items:center}.topnav button{background:none;border:0;color:#777583;height:100%;border-bottom:2px solid transparent}.topnav button.active{color:var(--purple);border-color:var(--purple);font-weight:650}.spacer{flex:1}.search{height:34px;border:1px solid var(--line);border-radius:7px;padding:0 11px;width:210px;background:#fafafd}.avatar{height:31px;width:31px;border-radius:50%;display:grid;place-items:center;background:#ebe4ff;color:#6142bb;font-weight:700}.layout{display:grid;grid-template-columns:224px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 62px)}aside{padding:25px 15px;border-right:1px solid var(--line);background:#fff}.side-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#9997a2;font-weight:700;padding:10px 12px}.side-link{width:100%;height:38px;border:0;background:none;text-align:left;padding:0 12px;border-radius:7px;color:#62606d;display:flex;align-items:center;gap:10px;margin:2px 0}.side-link.active,.side-link:hover{background:var(--lav);color:var(--purple);font-weight:650}.side-link .count{margin-left:auto;color:#a5a2ae;font-size:12px}.side-bottom{margin-top:26px;border-top:1px solid var(--line);padding-top:17px}.main{padding:35px clamp(22px,4vw,58px);max-width:1240px;width:100%;margin:auto}.crumb{font-size:12px;color:#9795a1;margin-bottom:12px}.heading{display:flex;align-items:flex-start;gap:15px;margin-bottom:24px}.heading h1{font-size:26px;letter-spacing:-.8px;margin:0 0 4px}.heading p{margin:0;color:var(--muted)}.actions{margin-left:auto;display:flex;gap:9px}.btn{border:1px solid #dfdde5;border-radius:7px;background:#fff;color:#514f5c;padding:9px 13px;font-weight:600}.btn:hover{border-color:#c4b7eb}.btn.primary{background:var(--purple);color:white;border-color:var(--purple)}.btn.primary:hover{background:#613acb}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:21px 0 27px}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px 18px}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:24px;font-weight:720;letter-spacing:-.8px;margin-top:6px}.stat-foot{font-size:11px;color:#9996a3;margin-top:2px}.section-head{display:flex;align-items:center;margin:25px 0 12px}.section-head h2{font-size:16px;margin:0;font-weight:680}.section-head span{margin-left:8px;color:#9b99a4;font-size:12px}.section-head .btn{margin-left:auto;padding:7px 10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:17px;transition:box-shadow .15s,transform .15s;cursor:pointer}.card:hover{box-shadow:0 6px 20px #28263312;transform:translateY(-1px)}.card-top{display:flex;gap:11px;align-items:flex-start}.project-icon{height:37px;width:37px;border-radius:9px;display:grid;place-items:center;font-weight:750;font-size:13px;flex-shrink:0}.card h3{font-size:14px;margin:0 0 3px}.owner{font-size:11px;color:#8c8996}.menu{margin-left:auto;border:0;background:none;color:#999;font-size:19px;padding:0 4px}.desc{font-size:12px;color:#777583;margin:14px 0 17px;min-height:32px}.progress-row{display:flex;justify-content:space-between;color:#898692;font-size:11px;margin-bottom:7px}.progress{height:5px;background:#f0eff3;border-radius:8px;overflow:hidden}.progress i{height:100%;display:block;background:var(--purple);border-radius:8px}.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:15px;padding-top:13px;border-top:1px solid #f1f0f3;color:#8d8a96;font-size:11px}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:20px;background:#f1f0f3;color:#76737f;font-size:10px;font-weight:650}.pill.green{background:#e9f6f2;color:var(--green)}.pill.amber{background:#fff4e5;color:var(--amber)}.people{display:flex}.person{height:23px;width:23px;border-radius:50%;border:2px solid white;background:#e8e4f4;color:#5e4b94;display:grid;place-items:center;font-size:8px;font-weight:700;margin-left:-5px}.person:first-child{margin-left:0}.task-panel{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}.task-row{display:grid;grid-template-columns:24px minmax(180px,1fr) 120px 110px 85px;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid #f1f0f3}.task-row:last-child{border-bottom:0}.task-row.header{background:#fbfafc;color:#918f9a;font-size:11px;font-weight:650}.task-title{font-weight:550}.task-meta{color:#85828f;font-size:11px}.check{height:15px;width:15px;accent-color:var(--purple)}.due{color:#777583;font-size:11px}.empty{border:1px dashed #d8d5df;border-radius:9px;text-align:center;padding:50px 20px;background:white;color:#777583}.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}.back{border:0;background:none;color:var(--purple);padding:0;margin:0 0 18px;font-weight:600}.detail-head{display:flex;align-items:center;gap:12px}.detail-head h1{margin:0}.detail-summary{background:white;border:1px solid var(--line);border-radius:9px;padding:17px 20px;margin:18px 0 24px;display:flex;align-items:center;gap:32px}.summary-item{color:#777583;font-size:11px}.summary-item b{display:block;color:var(--ink);font-size:13px;margin-top:4px}.modal-back{position:fixed;inset:0;background:#25232f66;z-index:10;display:grid;place-items:center;padding:20px}.modal{background:white;border-radius:12px;width:min(480px,100%);padding:23px;box-shadow:0 18px 55px #17141f35}.modal h2{margin:0 0 4px;font-size:19px}.modal p{margin:0 0 18px;color:var(--muted);font-size:12px}.field{display:block;margin:13px 0}.field span{display:block;font-size:12px;font-weight:650;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #dedce5;border-radius:7px;padding:10px 11px;outline:none;background:white}.field input:focus,.field textarea:focus{border-color:#9e88e8;box-shadow:0 0 0 3px #714bdb19}.field textarea{resize:vertical;min-height:74px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2c2935;color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;z-index:20;box-shadow:0 5px 20px #0003}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:190px 1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.topbar{padding:0 15px;gap:15px}.topnav{display:none}.search{width:min(190px,40vw)}.layout{display:block}aside{display:none}.main{padding:25px 16px}.grid{grid-template-columns:1fr}.heading{flex-wrap:wrap}.actions{margin-left:0;width:100%}.stats{gap:9px}.stat{padding:13px}.task-row{grid-template-columns:22px minmax(0,1fr) 72px;gap:7px;padding:12px}.task-row>:nth-child(3),.task-row>:nth-child(4){display:none}.task-row.header>:nth-child(3),.task-row.header>:nth-child(4){display:none}.detail-summary{gap:14px;flex-wrap:wrap}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="brand"><span class="brand-mark">N</span>Nexo</div><nav class="topnav"><button class="active" data-nav="projects">Proyectos</button><button data-nav="tasks">Tareas</button></nav><div class="spacer"></div><input class="search" id="search" placeholder="Buscar proyectos..." aria-label="Buscar"><div class="avatar" title="Usuario">A</div></header>
  <div class="layout"><aside><div class="side-label">Espacio de trabajo</div><button class="side-link active" data-nav="projects">▦ <span>Proyectos</span><span class="count" id="side-count">0</span></button><button class="side-link" data-nav="tasks">☷ <span>Mis tareas</span></button><div class="side-label" style="margin-top:19px">Vistas</div><button class="side-link" data-filter="all">◷ <span>Todos los proyectos</span></button><button class="side-link" data-filter="active">◉ <span>En progreso</span></button><button class="side-link" data-filter="done">✓ <span>Completados</span></button><div class="side-bottom"><button class="side-link" id="new-side">＋ <span>Nuevo proyecto</span></button></div></aside>
    <main class="main" id="main"></main>
  </div>
</div><div id="overlay"></div><div id="toast" class="toast hidden"></div>
<script>
const KEY='nexo-projects-v1';
const colors=[['#efeaff','#674ac1'],['#e6f4f1','#277c69'],['#fff0e7','#b66c35'],['#eaf1ff','#416fb7'],['#fcebf1','#b65378']];
let projects=load(),view='projects',filter='all',selected=null,query='';
const truckProject={id:'control-camiones-app',name:'Control de camiones',owner:'Aplicación web',description:'Distribuidores, camiones por placa y camionadas de balastro, piedrín y asfalto, con ingresos y egresos.',status:'En progreso',due:'',tasks:[],externalUrl:'https://tablet3lasazaleas-create.github.io/proyectos/control-camiones/'};
if(!projects.some(p=>p.id===truckProject.id))projects.unshift(truckProject);
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return []}}
function save(){localStorage.setItem(KEY,JSON.stringify(projects));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function doneCount(p){return p.tasks.filter(t=>t.done).length}
function progress(p){return p.tasks.length?Math.round(doneCount(p)/p.tasks.length*100):0}
function short(s){return s.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'P'}
function fmtDate(d){if(!d)return 'Sin fecha';return new Date(d+'T12:00:00').toLocaleDateString('es',{day:'numeric',month:'short'})}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2200)}
function render(){document.getElementById('side-count').textContent=projects.length;const root=document.getElementById('main');if(view==='detail'){renderDetail(root);return}if(view==='tasks'){renderTasks(root);return}renderProjects(root)}
function renderProjects(root){let list=projects.filter(p=>(filter==='all'||(filter==='active'?p.status!=='Completado':p.status==='Completado'))&&(`${p.name} ${p.owner} ${p.description}`.toLowerCase().includes(query.toLowerCase())));const totalTasks=projects.reduce((n,p)=>n+p.tasks.length,0),complete=projects.filter(p=>p.status==='Completado').length,active=projects.filter(p=>p.status!=='Completado').length;
root.innerHTML=`<div class="crumb">Espacio de trabajo / Proyectos</div><div class="heading"><div><h1>Proyectos</h1><p>Organiza el trabajo de tu equipo en un solo lugar.</p></div><div class="actions"><button class="btn" id="export">Exportar datos</button><button class="btn primary" id="create">＋ Nuevo proyecto</button></div></div><div class="stats"><div class="stat"><div class="stat-label">Proyectos activos</div><div class="stat-value">${active}</div><div class="stat-foot">En curso o por iniciar</div></div><div class="stat"><div class="stat-label">Tareas registradas</div><div class="stat-value">${totalTasks}</div><div class="stat-foot">En todos tus proyectos</div></div><div class="stat"><div class="stat-label">Tareas completadas</div><div class="stat-value">${projects.reduce((n,p)=>n+doneCount(p),0)}</div><div class="stat-foot">Trabajo finalizado</div></div><div class="stat"><div class="stat-label">Proyectos completados</div><div class="stat-value">${complete}</div><div class="stat-foot">Cerrados con éxito</div></div></div><div class="section-head"><h2>${filter==='done'?'Completados':filter==='active'?'En progreso':'Todos los proyectos'}</h2><span>${list.length}</span><button class="btn" id="sort">Ordenar: recientes</button></div>${list.length?`<div class="grid">${list.map((p,i)=>projectCard(p,i)).join('')}</div>`:`<div class="empty"><strong>${projects.length?'No hay proyectos en esta vista':'Tu espacio de trabajo está listo'}</strong>${projects.length?'Prueba otra vista o crea un nuevo proyecto.':'Crea tu primer proyecto y empieza a organizar tareas y fechas.'}<div style="margin-top:15px"><button class="btn primary" id="empty-create">＋ Crear proyecto</button></div></div>`}`;
root.querySelector('#create')?.addEventListener('click',()=>projectModal());root.querySelector('#empty-create')?.addEventListener('click',()=>projectModal());root.querySelector('#export')?.addEventListener('click',exportData);root.querySelector('#sort')?.addEventListener('click',()=>{projects.reverse();save()});root.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{selected=el.dataset.open;view='detail';render()}));}
function projectCard(p,i){if(p.externalUrl)return `<a class="card" href="${esc(p.externalUrl)}" target="_blank" rel="noopener"><div class="card-top"><div class="project-icon" style="background:#eaf1fc;color:#245fbb">CC</div><div><h3>${esc(p.name)}</h3><div class="owner">${esc(p.owner)}</div></div><span class="pill green" style="margin-left:auto">Disponible</span></div><p class="desc">${esc(p.description)}</p><div class="progress-row"><span>Acceder al sistema</span><span>↗</span></div><div class="progress"><i style="width:100%"></i></div><div class="card-foot"><span>Aplicación publicada</span><span>Abrir en otra pestaña</span></div></a>`;let c=colors[i%colors.length],pct=progress(p),status=p.status==='Completado'?'green':p.status==='En pausa'?'amber':'';return `<article class="card" data-open="${p.id}"><div class="card-top"><div class="project-icon" style="background:${c[0]};color:${c[1]}">${esc(short(p.name))}</div><div><h3>${esc(p.name)}</h3><div class="owner">${esc(p.owner||'Sin responsable')}</div></div><button class="menu" title="Opciones" data-menu="${p.id}" onclick="event.stopPropagation();editProject('${p.id}')">···</button></div><p class="desc">${esc(p.description||'Sin descripción añadida.')}</p><div class="progress-row"><span>Progreso</span><span>${pct}%</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="card-foot"><span class="pill ${status}">${esc(p.status)}</span><span>${doneCount(p)}/${p.tasks.length} tareas</span><span>${fmtDate(p.due)}</span></div></article>`}
function renderDetail(root){let p=projects.find(x=>x.id===selected);if(!p){view='projects';return render()}let pct=progress(p);root.innerHTML=`<button class="back" id="back">← Todos los proyectos</button><div class="heading"><div class="project-icon" style="background:#efeaff;color:#674ac1">${esc(short(p.name))}</div><div><div class="crumb">Proyectos / ${esc(p.name)}</div><div class="detail-head"><h1>${esc(p.name)}</h1><span class="pill ${p.status==='Completado'?'green':p.status==='En pausa'?'amber':''}">${esc(p.status)}</span></div><p>${esc(p.description||'Sin descripción añadida.')}</p></div><div class="actions"><button class="btn" id="edit">Editar proyecto</button><button class="btn primary" id="addtask">＋ Nueva tarea</button></div></div><div class="detail-summary"><div class="summary-item">Responsable<b>${esc(p.owner||'Sin asignar')}</b></div><div class="summary-item">Fecha de entrega<b>${fmtDate(p.due)}</b></div><div class="summary-item">Tareas<b>${doneCount(p)} de ${p.tasks.length} completadas</b></div><div style="flex:1"><div class="progress-row"><span>Progreso</span><span>${pct}%</span></div><div class="progress"><i style="width:${pct}%"></i></div></div></div><div class="section-head"><h2>Tareas</h2><span>${p.tasks.length}</span><button class="btn" id="delete-project">Eliminar proyecto</button></div>${p.tasks.length?`<div class="task-panel"><div class="task-row header"><span></span><span>Tarea</span><span>Responsable</span><span>Fecha límite</span><span>Estado</span></div>${p.tasks.map(t=>`<div class="task-row"><input class="check" type="checkbox" ${t.done?'checked':''} data-task="${t.id}" aria-label="Completar ${esc(t.name)}"><span class="task-title" style="${t.done?'text-decoration:line-through;color:#999':''}">${esc(t.name)}</span><span class="task-meta">${esc(t.owner||'Sin asignar')}</span><span class="due">${fmtDate(t.due)}</span><span class="pill ${t.done?'green':''}">${t.done?'Hecha':'Pendiente'}</span></div>`).join('')}</div>`:`<div class="empty"><strong>Aún no hay tareas</strong>Añade tareas para dar seguimiento al trabajo del proyecto.<div style="margin-top:15px"><button class="btn primary" id="empty-task">＋ Añadir tarea</button></div></div>`}`;
root.querySelector('#back').onclick=()=>{view='projects';render()};root.querySelector('#edit').onclick=()=>projectModal(p);root.querySelector('#addtask').onclick=()=>taskModal(p);root.querySelector('#empty-task')?.addEventListener('click',()=>taskModal(p));root.querySelector('#delete-project').onclick=()=>{if(confirm(`¿Eliminar “${p.name}” y sus tareas?`)){projects=projects.filter(x=>x.id!==p.id);view='projects';save()}};root.querySelectorAll('[data-task]').forEach(el=>el.onchange=()=>{let t=p.tasks.find(x=>x.id===el.dataset.task);t.done=el.checked;save()})}
function renderTasks(root){let all=projects.flatMap(p=>p.tasks.map(t=>({...t,project:p.name,pid:p.id})));root.innerHTML=`<div class="crumb">Espacio de trabajo / Tareas</div><div class="heading"><div><h1>Tareas</h1><p>Un vistazo al trabajo de todos tus proyectos.</p></div></div><div class="section-head"><h2>Todas las tareas</h2><span>${all.length}</span></div>${all.length?`<div class="task-panel"><div class="task-row header"><span></span><span>Tarea</span><span>Proyecto</span><span>Fecha límite</span><span>Estado</span></div>${all.map(t=>`<div class="task-row"><input class="check" type="checkbox" ${t.done?'checked':''} data-task="${t.id}" data-project="${t.pid}" aria-label="Completar ${esc(t.name)}"><span class="task-title" data-go="${t.pid}" style="cursor:pointer;${t.done?'text-decoration:line-through;color:#999':''}">${esc(t.name)}</span><span class="task-meta">${esc(t.project)}</span><span class="due">${fmtDate(t.due)}</span><span class="pill ${t.done?'green':''}">${t.done?'Hecha':'Pendiente'}</span></div>`).join('')}</div>`:`<div class="empty"><strong>No hay tareas todavía</strong>Entra a un proyecto para añadir la primera.</div>`}`;root.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{selected=el.dataset.go;view='detail';render()});root.querySelectorAll('[data-task]').forEach(el=>el.onchange=()=>{let p=projects.find(x=>x.id===el.dataset.project),t=p.tasks.find(x=>x.id===el.dataset.task);t.done=el.checked;save()})}
function modal(html){document.getElementById('overlay').innerHTML=`<div class="modal-back" id="modal-back"><section class="modal">${html}</section></div>`;document.getElementById('modal-back').onclick=e=>{if(e.target.id==='modal-back')closeModal()}}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function projectModal(p){let editing=!!p;modal(`<h2>${editing?'Editar proyecto':'Crear proyecto'}</h2><p>${editing?'Actualiza los detalles de tu proyecto.':'Define un espacio para organizar tareas, responsables y fechas.'}</p><form id="project-form"><label class="field"><span>Nombre del proyecto *</span><input name="name" required maxlength="70" placeholder="Ej. Lanzamiento de sitio web" value="${esc(p?.name||'')}"></label><label class="field"><span>Descripción</span><textarea name="description" maxlength="220" placeholder="¿Qué busca lograr este proyecto?">${esc(p?.description||'')}</textarea></label><label class="field"><span>Responsable</span><input name="owner" maxlength="50" placeholder="Nombre de la persona responsable" value="${esc(p?.owner||'')}"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="field"><span>Fecha de entrega</span><input name="due" type="date" value="${esc(p?.due||'')}"></label><label class="field"><span>Estado</span><select name="status"><option ${p?.status==='Por iniciar'?'selected':''}>Por iniciar</option><option ${!p||p.status==='En progreso'?'selected':''}>En progreso</option><option ${p?.status==='En pausa'?'selected':''}>En pausa</option><option ${p?.status==='Completado'?'selected':''}>Completado</option></select></label></div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" type="submit">${editing?'Guardar cambios':'Crear proyecto'}</button></div></form>`);document.getElementById('cancel').onclick=closeModal;document.getElementById('project-form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(editing)Object.assign(p,d);else projects.unshift({id:crypto.randomUUID(),...d,tasks:[],created:Date.now()});closeModal();save();toast(editing?'Proyecto actualizado':'Proyecto creado')};setTimeout(()=>document.querySelector('[name=name]')?.focus(),0)}
function editProject(id){let p=projects.find(x=>x.id===id);if(p)projectModal(p)}
function taskModal(p){modal(`<h2>Nueva tarea</h2><p>Añade trabajo al proyecto “${esc(p.name)}”.</p><form id="task-form"><label class="field"><span>Nombre de la tarea *</span><input name="name" required maxlength="90" placeholder="Ej. Preparar el calendario del proyecto"></label><label class="field"><span>Responsable</span><input name="owner" maxlength="50" placeholder="Nombre de la persona"></label><label class="field"><span>Fecha límite</span><input name="due" type="date"></label><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" type="submit">Añadir tarea</button></div></form>`);document.getElementById('cancel').onclick=closeModal;document.getElementById('task-form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));p.tasks.push({id:crypto.randomUUID(),...d,done:false});closeModal();save();toast('Tarea añadida')};setTimeout(()=>document.querySelector('[name=name]')?.focus(),0)}
function exportData(){let blob=new Blob([JSON.stringify(projects,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nexo-proyectos.json';a.click();URL.revokeObjectURL(a.href);toast('Datos exportados')}
document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{view=el.dataset.nav;document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===view));render()});document.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{filter=el.dataset.filter;view='projects';render()});document.getElementById('new-side').onclick=()=>projectModal();document.getElementById('search').oninput=e=>{query=e.target.value;view='projects';render()};render();
</script>
</body>
</html>
